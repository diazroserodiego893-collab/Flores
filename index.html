<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas - Galería Circular</title>
  
  <!-- Librerías externas: TailwindCSS y OGL para el motor 3D -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/ogl"></script>
  
  <!-- Estilos de animación y cursor -->
  <style>
    .circular-gallery {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }
    .circular-gallery:active {
      cursor: grabbing;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between font-sans relative overflow-x-hidden">

  <!-- ================================================================= -->
  <!-- 1. ENCABEZADO Y TÍTULOS (Cambia los textos de la pantalla aquí)  -->
  <!-- ================================================================= -->
  <header class="text-center pt-8 px-4 z-10">
    <div class="animate-float inline-block mb-2">
      <span class="text-6xl">🌻</span>
    </div>
    <h1 class="text-4xl md:text-5xl font-black text-amber-400 mb-2">
      Flores Amarillas
    </h1>
    <p class="text-slate-400 text-sm md:text-base">
      Arrastra para explorar. ¡Haz clic en una foto para leer una cartita! 💌
    </p>
  </header>

  <!-- Contenedor donde renderiza la galería 3D -->
  <main class="w-full flex-1 my-4">
    <div id="gallery-container" style="height: 550px; position: relative;" class="w-full"></div>
  </main>

  <!-- Pie de página -->
  <footer class="py-4 text-center text-slate-600 text-xs font-semibold">
    Creado por Diego Diaz1 💛
  </footer>


  <!-- ================================================================= -->
  <!-- 2. VENTANA EMERGENTE / MODAL DE LA CARTA                        -->
  <!-- (Aquí puedes cambiar el diseño o la firma del mensaje)             -->
  <!-- ================================================================= -->
  <div id="letter-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-300 opacity-0">
    <div class="bg-amber-50 text-slate-800 max-w-md w-full rounded-2xl p-6 md:p-8 shadow-2xl border-4 border-amber-300 relative transform scale-95 transition-transform duration-300" id="modal-card">
      
      <!-- Botón de cerrar (X) -->
      <button id="close-btn" class="absolute top-3 right-4 text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
      
      <!-- Icono y Título dentro de la carta -->
      <div class="text-center mb-4">
        <span class="text-4xl">💌</span>
        <h2 id="card-title" class="text-2xl font-bold text-amber-700 mt-2">Para Tina</h2>
      </div>

      <!-- Texto del mensaje que cambia según la foto -->
      <p id="card-message" class="text-slate-700 leading-relaxed text-center font-serif text-lg my-4">
        Mensaje...
      </p>

      <!-- Firma al pie de la carta -->
      <div class="text-right mt-6">
        <span class="text-amber-600 font-semibold italic text-sm">Con todo mi cariño 💛</span>
      </div>

    </div>
  </div>


  <!-- ================================================================= -->
  <!-- 3. CÓDIGO JAVASCRIPT (LÓGICA Y PROGRAMACIÓN DE LA GALERÍA)       -->
  <!-- ================================================================= -->
  <script>
    const { Renderer, Camera, Transform, Plane, Mesh, Program, Texture } = OGL;

    function lerp(p1, p2, t) {
      return p1 + (p2 - p1) * t;
    }

    function createTextTexture(gl, text, font = 'bold 30px sans-serif', color = '#ffffff') {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      context.font = font;
      const metrics = context.measureText(text);
      const textWidth = Math.ceil(metrics.width);
      const textHeight = 36;
      canvas.width = textWidth + 20;
      canvas.height = textHeight + 20;
      context.font = font;
      context.fillStyle = color;
      context.textBaseline = 'middle';
      context.textAlign = 'center';
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillText(text, canvas.width / 2, canvas.height / 2);
      const texture = new Texture(gl, { generateMipmaps: false });
      texture.image = canvas;
      return { texture, width: canvas.width, height: canvas.height };
    }

    class Title {
      constructor({ gl, plane, text, textColor = '#ffffff' }) {
        this.gl = gl;
        this.plane = plane;
        this.text = text;
        this.textColor = textColor;
        this.createMesh();
      }
      createMesh() {
        const { texture, width, height } = createTextTexture(this.gl, this.text, 'bold 30px sans-serif', this.textColor);
        const geometry = new Plane(this.gl);
        const program = new Program(this.gl, {
          vertex: `
            attribute vec3 position;
            attribute vec2 uv;
            uniform mat4 modelViewMatrix;
            uniform mat4 projectionMatrix;
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragment: `
            precision highp float;
            uniform sampler2D tMap;
            varying vec2 vUv;
            void main() {
              vec4 color = texture2D(tMap, vUv);
              if (color.a < 0.1) discard;
              gl_FragColor = color;
            }
          `,
          uniforms: { tMap: { value: texture } },
          transparent: true
        });
        this.mesh = new Mesh(this.gl, { geometry, program });
        const aspect = width / height;
        const textHeight = this.plane.scale.y * 0.15;
        const textWidth = textHeight * aspect;
        this.mesh.scale.set(textWidth, textHeight, 1);
        this.mesh.position.y = -this.plane.scale.y * 0.5 - textHeight * 0.5 - 0.05;
        this.mesh.setParent(this.plane);
      }
    }

    class Media {
      constructor({ geometry, gl, image, index, length, scene, screen, text, letter, viewport, bend, textColor, borderRadius = 0.05 }) {
        this.extra = 0;
        this.geometry = geometry;
        this.gl = gl;
        this.image = image;
        this.index = index;
        this.length = length;
        this.scene = scene;
        this.screen = screen;
        this.text = text;
        this.letter = letter;
        this.viewport = viewport;
        this.bend = bend;
        this.textColor = textColor;
        this.borderRadius = borderRadius;
        this.createShader();
        this.createMesh();
        this.createTitle();
        this.onResize();
      }
      createShader() {
        const texture = new Texture(this.gl, { generateMipmaps: true });
        this.program = new Program(this.gl, {
          depthTest: false,
          depthWrite: false,
          vertex: `
            precision highp float;
            attribute vec3 position;
            attribute vec2 uv;
            uniform mat4 modelViewMatrix;
            uniform mat4 projectionMatrix;
            uniform float uTime;
            uniform float uSpeed;
            varying vec2 vUv;
            void main() {
              vUv = uv;
              vec3 p = position;
              p.z = (sin(p.x * 4.0 + uTime) * 1.5 + cos(p.y * 2.0 + uTime) * 1.5) * (0.1 + uSpeed * 0.5);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
            }
          `,
          fragment: `
            precision highp float;
            uniform vec2 uImageSizes;
            uniform vec2 uPlaneSizes;
            uniform sampler2D tMap;
            uniform float uBorderRadius;
            varying vec2 vUv;
            
            float roundedBoxSDF(vec2 p, vec2 b, float r) {
              vec2 d = abs(p) - b;
              return length(max(d, vec2(0.0))) + min(max(d.x, d.y), 0.0) - r;
            }
            
            void main() {
              vec2 ratio = vec2(
                min((uPlaneSizes.x / uPlaneSizes.y) / (uImageSizes.x / uImageSizes.y), 1.0),
                min((uPlaneSizes.y / uPlaneSizes.x) / (uImageSizes.y / uImageSizes.x), 1.0)
              );
              vec2 uv = vec2(
                vUv.x * ratio.x + (1.0 - ratio.x) * 0.5,
                vUv.y * ratio.y + (1.0 - ratio.y) * 0.5
              );
              vec4 color = texture2D(tMap, uv);
              float d = roundedBoxSDF(vUv - 0.5, vec2(0.5 - uBorderRadius), uBorderRadius);
              float alpha = 1.0 - smoothstep(-0.002, 0.002, d);
              gl_FragColor = vec4(color.rgb, alpha);
            }
          `,
          uniforms: {
            tMap: { value: texture },
            uPlaneSizes: { value: [0, 0] },
            uImageSizes: { value: [0, 0] },
            uSpeed: { value: 0 },
            uTime: { value: 100 * Math.random() },
            uBorderRadius: { value: this.borderRadius }
          },
          transparent: true
        });
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = this.image;
        img.onload = () => {
          texture.image = img;
          this.program.uniforms.uImageSizes.value = [img.naturalWidth, img.naturalHeight];
        };
      }
      createMesh() {
        this.plane = new Mesh(this.gl, { geometry: this.geometry, program: this.program });
        this.plane.setParent(this.scene);
      }
      createTitle() {
        this.title = new Title({ gl: this.gl, plane: this.plane, text: this.text, textColor: this.textColor });
      }
      update(scroll, direction) {
        this.plane.position.x = this.x - scroll.current - this.extra;
        const x = this.plane.position.x;
        const H = this.viewport.width / 2;

        if (this.bend === 0) {
          this.plane.position.y = 0;
          this.plane.rotation.z = 0;
        } else {
          const B_abs = Math.abs(this.bend);
          const R = (H * H + B_abs * B_abs) / (2 * B_abs);
          const effectiveX = Math.min(Math.abs(x), H);
          const arc = R - Math.sqrt(R * R - effectiveX * effectiveX);
          this.plane.position.y = this.bend > 0 ? -arc : arc;
          this.plane.rotation.z = (this.bend > 0 ? -1 : 1) * Math.sign(x) * Math.asin(effectiveX / R);
        }

        this.speed = scroll.current - scroll.last;
        this.program.uniforms.uTime.value += 0.04;
        this.program.uniforms.uSpeed.value = this.speed;

        const planeOffset = this.plane.scale.x / 2;
        const viewportOffset = this.viewport.width / 2;
        this.isBefore = this.plane.position.x + planeOffset < -viewportOffset;
        this.isAfter = this.plane.position.x - planeOffset > viewportOffset;
        if (direction === 'right' && this.isBefore) {
          this.extra -= this.widthTotal;
          this.isBefore = this.isAfter = false;
        }
        if (direction === 'left' && this.isAfter) {
          this.extra += this.widthTotal;
          this.isBefore = this.isAfter = false;
        }
      }
      onResize({ screen, viewport } = {}) {
        if (screen) this.screen = screen;
        if (viewport) this.viewport = viewport;
        this.scale = this.screen.height / 1500;
        this.plane.scale.y = (this.viewport.height * (900 * this.scale)) / this.screen.height;
        this.plane.scale.x = (this.viewport.width * (700 * this.scale)) / this.screen.width;
        this.plane.program.uniforms.uPlaneSizes.value = [this.plane.scale.x, this.plane.scale.y];
        this.padding = 2;
        this.width = this.plane.scale.x + this.padding;
        this.widthTotal = this.width * this.length;
        this.x = this.width * this.index;
      }
    }

    class App {
      constructor(container, { items, bend = 3, textColor = '#fbbf24', borderRadius = 0.05, scrollSpeed = 2, scrollEase = 0.05 } = {}) {
        this.container = container;
        this.scrollSpeed = scrollSpeed;
        this.scroll = { ease: scrollEase, current: 0, target: 0, last: 0 };
        this.dragDistance = 0;
        this.createRenderer();
        this.createCamera();
        this.createScene();
        this.onResize();
        this.createGeometry();
        this.createMedias(items, bend, textColor, borderRadius);
        this.update();
        this.addEventListeners();
      }
      createRenderer() {
        this.renderer = new Renderer({ alpha: true, antialias: true, dpr: Math.min(window.devicePixelRatio || 1, 2) });
        this.gl = this.renderer.gl;
        this.gl.clearColor(0, 0, 0, 0);
        this.container.appendChild(this.gl.canvas);
      }
      createCamera() {
        this.camera = new Camera(this.gl);
        this.camera.fov = 45;
        this.camera.position.z = 20;
      }
      createScene() {
        this.scene = new Transform();
      }
      createGeometry() {
        this.planeGeometry = new Plane(this.gl, { heightSegments: 50, widthSegments: 100 });
      }

      /* ================================================================= */
      /* 4. LISTA DE FOTOS Y MENSAJES (¡EDITA AQUÍ TUS FOTOS Y CARTAS!)    */
      /* ================================================================= */
      createMedias(items, bend, textColor, borderRadius) {
        
const defaultItems = [
  { 
    image: 'foto1.jpg', 
    text: 'Flores Amarillas 💛',
    letter: 'Que este detalle de flores amarillas te recuerde lo especial que eres todos los días. 🌻' 
  },
  { 
    image: 'foto2.jpg', 
    text: 'Para Tina ✨',
    letter: 'Tu sonrisa ilumina cualquier día gris. Gracias por estar siempre ahí. ❤️' 
  },
  { 
    image: 'foto3.jpg', 
    text: 'Un Momento Especial 🌻',
    letter: 'Cada pequeño instante a tu lado se convierte en un gran recuerdo que guardo con cariño.' 
  },
  { 
    image: 'foto4.jpg', 
    text: 'Sonrisas 🌼',
    letter: 'Nunca dejes de sonreír, tienes la energía más bonita del mundo.' 
  },
  { 
    image: 'foto5.jpg', 
    text: 'Con Amor 💛',
    letter: 'Un pequeño espacio digital pensado especialmente para sacarte una sonrisa hoy.' 
  }
];
        const galleryItems = items && items.length ? items : defaultItems;
        this.mediasImages = galleryItems.concat(galleryItems);
        this.medias = this.mediasImages.map((data, index) => new Media({
          geometry: this.planeGeometry,
          gl: this.gl,
          image: data.image,
          index,
          length: this.mediasImages.length,
          scene: this.scene,
          screen: this.screen,
          text: data.text,
          letter: data.letter,
          viewport: this.viewport,
          bend,
          textColor,
          borderRadius
        }));
      }

      /* Controles de arrastrar y clic */
      onTouchDown(e) {
        this.isDown = true;
        this.scroll.position = this.scroll.current;
        this.start = e.touches ? e.touches[0].clientX : e.clientX;
        this.dragDistance = 0;
      }
      onTouchMove(e) {
        if (!this.isDown) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        this.dragDistance += Math.abs(this.start - x);
        this.scroll.target = this.scroll.position + (this.start - x) * (this.scrollSpeed * 0.025);
      }
      onTouchUp(e) { 
        if (this.isDown && this.dragDistance < 10) {
          this.handleClick(e);
        }
        this.isDown = false; 
      }
      handleClick(e) {
        const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

        const x = (clientX / this.screen.width) * 2 - 1;
        const y = -(clientY / this.screen.height) * 2 + 1;

        let closest = null;
        let minDistance = Infinity;

        this.medias.forEach(media => {
          const dist = Math.abs(media.plane.position.x - (x * (this.viewport.width / 2)));
          if (dist < minDistance && dist < media.plane.scale.x / 1.5) {
            minDistance = dist;
            closest = media;
          }
        });

        if (closest) {
          openLetter(closest.text, closest.letter);
        }
      }
      onWheel(e) {
        const delta = e.deltaY || e.wheelDelta || e.detail;
        this.scroll.target += (delta > 0 ? this.scrollSpeed : -this.scrollSpeed) * 0.2;
      }
      onResize() {
        this.screen = { width: this.container.clientWidth, height: this.container.clientHeight };
        this.renderer.setSize(this.screen.width, this.screen.height);
        this.camera.perspective({ aspect: this.screen.width / this.screen.height });
        const fov = (this.camera.fov * Math.PI) / 180;
        const height = 2 * Math.tan(fov / 2) * this.camera.position.z;
        this.viewport = { width: height * this.camera.aspect, height };
        if (this.medias) {
          this.medias.forEach(media => media.onResize({ screen: this.screen, viewport: this.viewport }));
        }
      }
      update() {
        this.scroll.current = lerp(this.scroll.current, this.scroll.target, this.scroll.ease);
        const direction = this.scroll.current > this.scroll.last ? 'right' : 'left';
        if (this.medias) {
          this.medias.forEach(media => media.update(this.scroll, direction));
        }
        this.renderer.render({ scene: this.scene, camera: this.camera });
        this.scroll.last = this.scroll.current;
        requestAnimationFrame(this.update.bind(this));
      }
      addEventListeners() {
        window.addEventListener('resize', this.onResize.bind(this));
        window.addEventListener('wheel', this.onWheel.bind(this));
        window.addEventListener('mousedown', this.onTouchDown.bind(this));
        window.addEventListener('mousemove', this.onTouchMove.bind(this));
        window.addEventListener('mouseup', this.onTouchUp.bind(this));
        window.addEventListener('touchstart', this.onTouchDown.bind(this));
        window.addEventListener('touchmove', this.onTouchMove.bind(this));
        window.addEventListener('touchend', this.onTouchUp.bind(this));
      }
    }


    /* ================================================================= */
    /* 5. ABRIR Y CERRAR LA VENTANA EMERGENTE                            */
    /* ================================================================= */
    const modal = document.getElementById('letter-modal');
    const modalCard = document.getElementById('modal-card');
    const closeBtn = document.getElementById('close-btn');
    const cardTitle = document.getElementById('card-title');
    const cardMessage = document.getElementById('card-message');

    function openLetter(title, message) {
      cardTitle.textContent = title;
      cardMessage.textContent = message || "¡Un mensaje muy especial para ti!";
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
        modalCard.classList.add('scale-100');
      }, 10);
    }

    function closeLetter() {
      modal.classList.add('opacity-0');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    closeBtn.addEventListener('click', closeLetter);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeLetter();
    });

    /* Inicializar la aplicación */
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('gallery-container');
      container.classList.add('circular-gallery');
      new App(container, {
        bend: 3,
        textColor: '#fbbf24',
        borderRadius: 0.05,
        scrollSpeed: 2,
        scrollEase: 0.05
      });
    });
  </script>
</body>
</html>
